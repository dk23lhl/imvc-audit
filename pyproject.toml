[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "imvc-audit"
version = "0.1.0"
description = "Audit toolkit for IMVC missing-data evaluation protocols: effective cell missing rate (r-hat) and complete-sample proportion (p_c)."
readme = "README.md"
requires-python = ">=3.7"
license = {text = "MIT"}
authors = [
    {name = "Haolu Liu"},
    {name = "Xiyue Wang"},
    {name = "Xuanting Xie"},
    {name = "Liangjian Wen"},
    {name = "Zhao Kang"},
]
dependencies = ["numpy>=1.20"]

[project.scripts]
imvc-audit = "imvc_audit.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["imvc_audit*"]
